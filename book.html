<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5B7CFA">
  <title>预约会议室</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <div class="app">
    <div class="topbar back">
      <div class="topbar-title" id="page-title">预约会议室</div>
    </div>

    <div class="page">
      <div class="card" id="room-card"></div>

      <div class="section-title">① 选择日期</div>
      <div class="section-tip" id="tip-advance">仅可预约未来 7 天内的工作时段</div>
      <div class="date-list" id="date-list"></div>

      <div class="section-title">② 选择时长</div>
      <div class="seg-control" id="seg-control">
        <div class="seg-item active" data-dur="30">30 分钟</div>
        <div class="seg-item" data-dur="60">1 小时</div>
      </div>

      <div class="section-title">③ 选择时段</div>
      <div class="section-tip">灰色为已占用，黄色为禁约时段</div>
      <div class="slot-grid" id="slot-grid"></div>

      <div class="section-title">④ 填写信息</div>
      <div class="card" style="padding: 20px;">
        <div class="form-group">
          <label class="form-label">公司名称<span class="req">*</span></label>
          <input class="form-input" id="f-company" placeholder="如：中关村生命科学园某公司" maxlength="50">
          <div class="form-error" id="e-company"></div>
        </div>
        <div class="form-group">
          <label class="form-label">预约人<span class="req">*</span></label>
          <input class="form-input" id="f-name" placeholder="如：张三" maxlength="20">
          <div class="form-error" id="e-name"></div>
        </div>
        <div class="form-group">
          <label class="form-label">联系方式<span class="req">*</span></label>
          <input class="form-input" id="f-phone" placeholder="11位手机号" inputmode="numeric" maxlength="11">
          <div class="form-error" id="e-phone"></div>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">会议主题<span style="color: var(--text-muted); font-weight: normal;">（选填）</span></label>
          <input class="form-input" id="f-remark" placeholder="如：产品评审、客户接待" maxlength="50">
        </div>
      </div>

      <div style="margin-top: 24px;">
        <button class="btn btn-primary btn-block" id="submit-btn">确认预约</button>
        <div style="text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px;">
          提交后请按时使用会议室，超时 15 分钟自动释放
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js?vc=pg1"></script>
  <script>
    MB.ready(function(){
      const rules = MB.Rules.get();
      const rooms = MB.Rooms.list();
      const roomId = MB.getQuery('room') || (rooms[0] && rooms[0].id);
      const room = MB.Rooms.get(roomId) || rooms[0];
      if (!room) {
        document.querySelector('.page').innerHTML = '<div class="empty"><p>暂无可预约会议室</p></div>';
        return;
      }
      const state = { date: new Date().toISOString().slice(0, 10), duration: rules.minDuration, slot: null, slots: [] };
      $('#tip-advance').textContent = `仅可预约未来 ${rules.advanceDays} 天内的工作时段（${rules.workStart}-${rules.workEnd}）`;

      const iconData = MB.ICONS.find(i => i.id === room.icon) || MB.ICONS[0];
      const colorData = MB.COLORS.find(c => c.id === room.color) || MB.COLORS[0];

      $('#page-title').textContent = `预约 · ${room.shortName || room.name}`;
      $('#room-card').innerHTML = `
        <div class="card-link">
          <div class="card-icon" style="background:${colorData.bg};color:${colorData.fg}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconData.svg}</svg>
          </div>
          <div class="card-body">
            <div class="card-title">${room.name}</div>
            <div class="card-meta">
              <span>📍 ${room.location || ''}</span>
              <span>👥 ${room.capacity}人</span>
              ${room.desc ? `<span>${room.desc}</span>` : ''}
            </div>
          </div>
        </div>
      `;

      function renderDates() {
        const dates = MB.getDateList();
        $('#date-list').innerHTML = dates.map(d => `
          <div class="date-item ${d.date === state.date ? 'active' : ''}" data-date="${d.date}">
            <div class="date-day">${d.isToday ? '今天' : '周' + d.day}</div>
            <div class="date-num">${d.num}</div>
            <div class="date-mon">${d.mon}月</div>
          </div>
        `).join('');
        $$('.date-item').forEach(el => {
          el.onclick = () => { state.date = el.dataset.date; state.slot = null; renderDates(); renderSlots(); };
        });
      }

      async function renderSlots() {
        const slots = await MB.generateSlots(state.date, state.duration, room.id);
        state.slots = slots;
        const grid = $('#slot-grid');
        if (slots.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 20px;">当前日期无可用时段</div>';
          return;
        }
        grid.innerHTML = slots.map(s => {
          const isActive = state.slot && state.slot.start === s.start && state.slot.end === s.end;
          return `
            <div class="slot-item ${s.disabled ? 'disabled' : ''} ${isActive ? 'active' : ''}" data-start="${s.start}" data-end="${s.end}" data-reason="${s.reason || ''}">
              ${s.start}
            </div>
          `;
        }).join('');
        $$('.slot-item:not(.disabled)').forEach(el => {
          el.onclick = () => { state.slot = { start: el.dataset.start, end: el.dataset.end }; renderSlots(); };
        });
      }

      $$('#seg-control .seg-item').forEach(el => {
        el.onclick = () => {
          state.duration = parseInt(el.dataset.dur);
          state.slot = null;
          $$('#seg-control .seg-item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          renderSlots();
        };
      });

      $('#submit-btn').onclick = async () => {
        const btn = $('#submit-btn');
        const company = $('#f-company').value.trim();
        const name = $('#f-name').value.trim();
        const phone = $('#f-phone').value.trim();
        const remark = $('#f-remark').value.trim();
        let ok = true;
        const showErr = (id, msg) => { const el = $('#'+id); el.textContent = msg; el.classList.toggle('show', !!msg); if (msg) ok = false; };
        showErr('e-company', company ? '' : '请填写公司名称');
        showErr('e-name', name ? '' : '请填写预约人');
        showErr('e-phone', /^1[3-9]\d{9}$/.test(phone) ? '' : '请填写正确的 11 位手机号');
        if (!state.slot) { MB.toast('请先选择预约时段'); ok = false; }
        if (!ok) return;
        btn.disabled = true; btn.innerHTML = '<span class="loader"></span> 提交中...';
        const result = await MB.Bookings.add({
          roomId: room.id, roomName: room.shortName || room.name,
          company, name, phone, remark,
          date: state.date, start: state.slot.start, end: state.slot.end, duration: state.duration
        });
        if (!result.ok) {
          btn.disabled = false; btn.textContent = '确认预约';
          if (result.error === 'conflict') {
            await MB.confirmModal({ title: '时段已被占用', message: `${result.conflict.company} 已预约该时段，请选择其他时段`, confirmText: '我知道了', cancelText: '关闭' });
            renderSlots();
          } else if (result.error === 'company_conflict') {
            await MB.confirmModal({ title: '同企业时段冲突', message: `贵公司在同时段已预约了 ${result.conflict.roomName}，请调整`, confirmText: '我知道了', cancelText: '关闭' });
          }
          return;
        }
        location.href = `success.html?id=${result.id}`;
      };

      renderDates(); renderSlots();
    });
  </script>
</body>
</html>
