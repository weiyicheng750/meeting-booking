<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5B7CFA">
  <title>预约成功</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <div class="app">
    <div class="page" style="text-align: center;">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">预约成功</h1>
      <p style="color: var(--text-muted); font-size: 14px;">请截图保存或截图核销码</p>

      <!-- 预约详情卡片 -->
      <div class="summary-card" style="text-align: left;">
        <div class="summary-row">
          <span class="summary-label">会议室</span>
          <span class="summary-value" id="s-room">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">日期</span>
          <span class="summary-value" id="s-date">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">时段</span>
          <span class="summary-value" id="s-time">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">公司</span>
          <span class="summary-value" id="s-company">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">预约人</span>
          <span class="summary-value" id="s-name">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">联系方式</span>
          <span class="summary-value" id="s-phone">—</span>
        </div>
        <div class="summary-row" id="row-remark" style="display: none;">
          <span class="summary-label">会议主题</span>
          <span class="summary-value" id="s-remark">—</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">预约号</span>
          <span class="summary-value" id="s-id" style="font-family: monospace; font-size: 13px;">—</span>
        </div>
      </div>

      <!-- 核销码 -->
      <div class="qr-box">
        <div class="qr-img" id="qr"></div>
        <div class="qr-text">
          <strong>核销码</strong>
          <p>园区前台扫码核销，请妥善保管</p>
        </div>
      </div>

      <!-- 提示 -->
      <div class="card" style="background: var(--warning-soft); border: none; box-shadow: none; text-align: left;">
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #92400E;">
          <span style="font-size: 18px;">⏰</span>
          <div>
            <strong style="display: block; margin-bottom: 4px;">温馨提示</strong>
            请按时到达会议室，如需取消请提前联系园区运营。
            超时 15 分钟未到，预约将自动释放。
          </div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px;">
        <button class="btn btn-primary btn-block" onclick="addToCalendar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          加入日历提醒
        </button>
        <button class="btn btn-ghost btn-block" onclick="location.href='index.html'">
          返回首页
        </button>
      </div>
    </div>
  </div>

  <script src="js/common.js?vc=pg1"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    MB.ready(function(){
    const id = MB.getQuery('id');
    const record = id ? MB.Bookings.get(id) : null;

    if (!record) {
      document.querySelector('.page').innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p>预约记录不存在</p>
          <button class="btn btn-primary" style="margin-top: 20px;" onclick="location.href='index.html'">返回首页</button>
        </div>
      `;
    } else {
      document.getElementById('s-room').textContent = record.roomName;
      document.getElementById('s-date').textContent = MB.formatDate(record.date);
      document.getElementById('s-time').textContent = `${record.start} - ${record.end}`;
      document.getElementById('s-company').textContent = record.company;
      document.getElementById('s-name').textContent = record.name;
      document.getElementById('s-phone').textContent = record.phone;
      document.getElementById('s-id').textContent = record.id;
      if (record.remark) {
        document.getElementById('row-remark').style.display = 'flex';
        document.getElementById('s-remark').textContent = record.remark;
      }

      // 生成核销二维码
      const qrText = `会议室预约核销
预约号:${record.id}
会议室:${record.roomName}
日期:${record.date}
时间:${record.start}-${record.end}
公司:${record.company}
预约人:${record.name}`;

      new QRCode(document.getElementById('qr'), {
        text: qrText,
        width: 84,
        height: 84,
        colorDark: '#111827',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      // 暴露给日历按钮
      window._record = record;
    }
    });

    function addToCalendar() {
      const r = window._record;
      if (!r) return;
      // 生成 ICS 文件
      const pad = n => String(n).padStart(2, '0');
      const startDate = r.date.replace(/-/g, '');
      const [sh, sm] = r.start.split(':');
      const [eh, em] = r.end.split(':');
      const start = `${startDate}T${pad(sh-0)}${pad(sm-0)}00`;
      const end = `${startDate}T${pad(eh-0)}${pad(em-0)}00`;

      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Meeting Booking//CN',
        'BEGIN:VEVENT',
        `UID:${r.id}@meeting-booking`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
        `DTSTART:${start}`,
        `DTEND:${end}`,
        `SUMMARY:${r.roomName} - ${r.remark || '会议室预约'}`,
        `DESCRIPTION:公司：${r.company}\\n预约人：${r.name}\\n电话：${r.phone}\\n预约号：${r.id}`,
        `LOCATION:中关村生命科学园·创新大厦`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${r.id}.ics`;
      a.click();
      URL.revokeObjectURL(url);
      MB.toast('日历文件已下载');
    }
  </script>
</body>
</html>
